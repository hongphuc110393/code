name: Python CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: python:3.14-alpine
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Check Python version
        run: python --version
