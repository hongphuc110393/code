name: Basic CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Lấy source code từ repository
      - name: Checkout source code
        uses: actions/checkout@v4
      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 3. Cài dependencies
      - name: Install dependencies
        run: npm ci
      # 4. Build
      - name: Build
        run: npm run build
      # 5. Run test
      - name: Test
        run: npm test
